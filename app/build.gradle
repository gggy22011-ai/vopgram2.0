plugins {
    id 'com.android.application'
}

android {
    namespace 'app.vopgram'
    compileSdk 34

    defaultConfig {
        applicationId "app.vopgram"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // assembleDebug подписывает APK автоматически debug-ключом Android
    buildTypes {
        debug { debuggable true }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
